<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 热点日报</title>
<meta name="description" content="每日从 X 平台汇总的 AI 热点资讯（中文）">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="shell">
<nav class="lnav" aria-label="主导航">
  <div class="logo"><i>AI</i><b>热点日报</b></div>
  <button class="nv" data-v="day"><svg viewBox="0 0 24 24"><path d="M21.59 7.92 12 1.76 2.41 7.92A1 1 0 0 0 2 8.76V21h7v-6h6v6h7V8.76a1 1 0 0 0-.41-.84z"/></svg><span>今日</span></button>
  <button class="nv" data-v="search"><svg viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.18 5.26l4.79 4.79-1.42 1.41-4.78-4.78A8.5 8.5 0 0 1 1.75 10.25z"/></svg><span>搜索</span></button>
  <button class="nv" data-v="fav"><svg viewBox="0 0 24 24"><path d="M4 4.5C4 3.12 5.12 2 6.5 2h11C18.88 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5z"/></svg><span>收藏</span><em class="cnt" id="favcnt"></em></button>
  <button class="nv" data-v="trend"><svg viewBox="0 0 24 24"><path d="M3 21V10h3v11H3zm7 0V3h3v18h-3zm7 0v-7h3v7h-3z"/></svg><span>趋势</span></button>
  <a class="nv" href="/api/export" download><svg viewBox="0 0 24 24"><path d="M11 3h2v10.59l3.3-3.3 1.4 1.42L12 17.41l-5.7-5.7 1.4-1.42 3.3 3.3V3zM4 19h16v2H4z"/></svg><span>导出数据</span></a>
  <button class="nv themebtn" data-theme-toggle title="切换浅色/深色"><svg class="i-moon" viewBox="0 0 24 24"><path d="M20.3 15.4A8.5 8.5 0 0 1 8.6 3.7 8.5 8.5 0 1 0 20.3 15.4z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm-1-6h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg><span class="themelabel">深色模式</span></button>
  <div class="navsec">历史日报</div><div class="dts" id="dates"></div>
  <div class="navsec">分类</div><div class="chips" id="chips"></div>
</nav>
<main id="mainCol">
  <header class="mh">
    <div class="mtop">
      <div class="mtitle"><h1 id="title">AI 热点日报</h1><div class="msub"><select id="mdate" class="mdate" aria-label="选择日期"></select><p id="sub">加载中…</p></div></div>
      <div class="mtools">
        <button class="ib" data-v="search" title="搜索"><svg viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.18 5.26l4.79 4.79-1.42 1.41-4.78-4.78A8.5 8.5 0 0 1 1.75 10.25z"/></svg></button>
        <button class="ib" data-v="fav" title="收藏"><svg viewBox="0 0 24 24"><path d="M4 4.5C4 3.12 5.12 2 6.5 2h11C18.88 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5z"/></svg></button>
        <button class="ib" data-v="trend" title="趋势"><svg viewBox="0 0 24 24"><path d="M3 21V10h3v11H3zm7 0V3h3v18h-3zm7 0v-7h3v7h-3z"/></svg></button>
        <a class="ib" href="/api/export" download title="导出数据"><svg viewBox="0 0 24 24"><path d="M11 3h2v10.59l3.3-3.3 1.4 1.42L12 17.41l-5.7-5.7 1.4-1.42 3.3 3.3V3zM4 19h16v2H4z"/></svg></a>
        <button class="ib themebtn" data-theme-toggle title="切换浅色/深色"><svg class="i-moon" viewBox="0 0 24 24"><path d="M20.3 15.4A8.5 8.5 0 0 1 8.6 3.7 8.5 8.5 0 1 0 20.3 15.4z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm-1-6h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg></button>
      </div>
    </div>
  </header>
  <div class="searchbar" id="searchbar"><label class="sbox"><svg viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.18 5.26l4.79 4.79-1.42 1.41-4.78-4.78A8.5 8.5 0 0 1 1.75 10.25z"/></svg><input id="q" type="search" placeholder="搜索全部日期的标题、摘要、原帖…" aria-label="搜索" enterkeyhint="search"></label></div>
  <div class="mobilebar" id="mchips"></div>
  <div id="tl"><div class="empty">加载中…</div></div>
</main>
<aside class="rcol">
  <div class="rsticky">
    <div class="panel" id="panel"></div>
    <div class="rfoot">数据来自 X 平台公开内容 · 互动数为抓取时数值 · 时间为北京时间（UTC+8）</div>
  </div>
</aside>
</div>
<script src="/app.js"></script>
</body></html>
